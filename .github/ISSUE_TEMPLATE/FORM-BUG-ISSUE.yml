name: Bug Report
description: File a bug report.
title: '[Bug]: '
labels: ['bug']
projects: ['sogo6']
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: 'A bug happened!'
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
      options:
        - Alpha
      default: 0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser did you encounter this issue on?
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
        - Other
      default: 0
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      description: Which type of device did you encounter this issue on?
      options:
        - Desktop
        - Smartphone
        - Tablet
        - Other
      default: 0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
